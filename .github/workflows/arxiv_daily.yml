name: Daily Research Paper Digest

on:
  schedule:
    # 每天 UTC 1 点运行，即北京时间上午 9 点
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper digest
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}

          FETCH_DAYS: ${{ vars.FETCH_DAYS || '2' }}
          MAX_RESULTS: ${{ vars.MAX_RESULTS || '20' }}
          SEARCH_KEYWORDS: ${{ vars.SEARCH_KEYWORDS || 'tweezer array,neutral atom,neutral atoms,PIC,microring,nanofiber,surface force' }}
          SEARCH_SOURCES: ${{ vars.SEARCH_SOURCES || 'arxiv,aps,nature,science,optica' }}
          SEARCH_CATEGORIES: ${{ vars.SEARCH_CATEGORIES || '' }}
          APS_JOURNALS: ${{ vars.APS_JOURNALS || '' }}
          APS_EXCLUDE_JOURNALS: ${{ vars.APS_EXCLUDE_JOURNALS || 'Physical Review B,Physical Review D,PRB,PRD' }}
          NATURE_JOURNALS: ${{ vars.NATURE_JOURNALS || 'Nature,Nature Physics,Nature Photonics,Nature Communications,npj Quantum Information,Nature Reviews Physics' }}
          SCIENCE_JOURNALS: ${{ vars.SCIENCE_JOURNALS || 'Science,Science Advances' }}
          OPTICA_JOURNALS: ${{ vars.OPTICA_JOURNALS || 'Optica' }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO || '' }}
        run: python main.py
